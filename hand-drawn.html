  <main>
    <section class="hero">
      <h1>Hand-Drawn Maps</h1>
      <p class="dek">Pencil-and-paper maps primarily done with charcoal.</p>
    </section>

    <section class="gis-band">
      <h2>State Maps</h2>
      <div class="gallery-grid masonry lightbox-grid">
        <figure class="gallery-item">
          <img src="images/hand-drawn/California_1.jpg" alt="Hand-drawn map of California">
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/Colorado%20Map_1.jpg" alt="Hand-drawn map of Colorado">
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/Florida_1.jpg" alt="Hand-drawn map of Florida">
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/idaho%20map_1.jpg" alt="Hand-drawn map of Idaho">
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/utah%20retake_1.jpg" alt="Hand-drawn map of Utah">
        </figure>
      </div>
    </section>

    <section class="gis-band">
      <h2>Regional Maps</h2>
      <div class="gallery-grid masonry lightbox-grid">
        <figure class="gallery-item">
          <img src="images/hand-drawn/IdahoWyoming_1.jpg" alt="Hand-drawn map of the Idaho/Wyoming border and Yellowstone area">
          <figcaption>Idaho Wyoming border</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/Colorado%20Springs_1.jpg" alt="Hand-drawn map of the Colorado Springs and Pueblo area">
          <figcaption>Colorado Springs</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/hand-drawn/Colorado%20Springs%20Mission_1.jpg" alt="Hand-drawn map of the Denver and Colorado Springs region">
          <figcaption>Southern Colorado region</figcaption>
        </figure>
      </div>
    </section>
